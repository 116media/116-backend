services:
    116_db:
        container_name: 116_db
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        restart: always
        ports:
            - "5432:5432"
        volumes:
            - postgres_116_db:/var/lib/postgres/data/
    116_seq:
        container_name: 116_seq
        environment:
            - ACCEPT_EULA=Y
        restart: always
        ports:
            - "5341:5341"
            - "9091:80"

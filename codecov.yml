# Codecov configuration for 116 Backend
# https://docs.codecov.com/docs/codecov-yaml

coverage:
    precision: 2
    round: down
    range: "60...100"

    status:
        project:
            default:
                target: auto
                threshold: 0%
                informational: false
                only_pulls: false
        patch:
            default:
                target: 80%
                threshold: 0%
                informational: false
                only_pulls: false

parsers:
    gcov:
        branch_detection:
            conditional: yes
            loop: yes
            method: no
            macro: no

comment:
    layout: "reach,diff,flags,components,files,footer"
    behavior: default
    require_changes: false
    require_base: false
    require_head: true
    after_n_builds: 2
    show_carryforward_flags: true

ignore:
    - "**/Migrations/**"
    - "**/tests/**"
    - "**/*.Designer.cs"
    - "**/Program.cs"

flag_management:
    default_rules:
        carryforward: true
        statuses:
            - type: project
              target: auto
              threshold: 0%
    individual_flags:
        - name: unit
          paths:
              - src/
          statuses:
              - type: patch
                target: 60%
                threshold: 0%
        - name: integration
          paths:
              - src/
          statuses:
              - type: patch
                target: 80%
                threshold: 0%

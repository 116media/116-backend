# Codecov configuration for 116 Backend
# https://docs.codecov.com/docs/codecov-yaml

coverage:
    precision: 2
    round: down
    range: "60...100"

    status:
        project:
            default:
                target: auto
                threshold: 0%
                informational: false
                only_pulls: false
        patch:
            default:
                target: 80%
                threshold: 0%
                informational: false
                only_pulls: false

parsers:
    gcov:
        branch_detection:
            conditional: yes
            loop: yes
            method: no
            macro: no

comment:
    layout: "reach,diff,flags,files,footer"
    behavior: default
    require_changes: false
    require_base: false
    require_head: true
    after_n_builds: 2

ignore:
    - "**/Migrations/**"
    - "**/tests/**"
    - "**/*.Designer.cs"
    - "**/Program.cs"

flags:
    unit:
        paths:
            - src/
        carryforward: true
    integration:
        paths:
            - src/
        carryforward: true

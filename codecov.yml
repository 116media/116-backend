# Codecov configuration for 116 Backend
# https://docs.codecov.com/docs/codecov-yaml

coverage:
    precision: 2
    round: down
    range: "60...100"

    status:
        project:
            default:
                target: auto
                threshold: 0%
                informational: false
                only_pulls: false
        patch:
            default:
                target: 80%
                threshold: 0%
                informational: false
                only_pulls: false

parsers:
    gcov:
        branch_detection:
            conditional: yes
            loop: yes
            method: no
            macro: no

# Codecov's own PR comment is disabled: the Tests workflow posts a single
# consolidated comment that reproduces the Codecov report header + patch verdict
# and adds the per-suite (unit vs integration) breakdown and changed-file gaps.
# Per-flag project/patch status checks below are unaffected by this.
comment: false

ignore:
    - "**/Migrations/**"
    - "**/tests/**"
    - "**/*.Designer.cs"
    - "**/Program.cs"

flag_management:
    default_rules:
        carryforward: true
        statuses:
            - type: project
              target: auto
              threshold: 0%
    individual_flags:
        - name: unit
          paths:
              - src/
          statuses:
              - type: project
                target: auto
                threshold: 0%
                informational: true
              - type: patch
                target: 60%
                threshold: 0%
        - name: integration
          paths:
              - src/
          statuses:
              - type: project
                target: auto
                threshold: 0%
                informational: true
              - type: patch
                target: 80%
                threshold: 0%

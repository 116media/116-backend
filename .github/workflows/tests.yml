name: Tests

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

env:
    DOTNET_VERSION: '9.0.x'
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore dependencies
              run: dotnet restore

            - name: Run Unit Tests with Coverage
              run: |
                  dotnet test tests/Unit \
                    --configuration Release \
                    --no-restore \
                    --settings tests/coverage.unit.runsettings \
                    --collect:"XPlat Code Coverage" \
                    --results-directory ./coverage/unit \
                    --logger "trx;LogFileName=unit-test-results.trx"

            - name: Upload Test Results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: unit-test-results
                  path: ./coverage/unit/*.trx
                  retention-days: 30

            - name: Upload Coverage Data
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: unit-coverage
                  path: ./coverage/unit/**/coverage.cobertura.xml
                  retention-days: 30

            - name: Upload to Codecov
              uses: codecov/codecov-action@v5
              with:
                  directory: ./coverage/unit
                  flags: unit
                  override_branch: ${{ github.head_ref || github.ref_name }}
                  override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
                  fail_ci_if_error: true
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    integration-tests:
        name: Integration Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore dependencies
              run: dotnet restore

            - name: Run Integration Tests with Coverage
              run: |
                  dotnet test tests/Integration \
                    --configuration Release \
                    --no-restore \
                    --settings tests/coverage.runsettings \
                    --collect:"XPlat Code Coverage" \
                    --results-directory ./coverage/integration \
                    --logger "trx;LogFileName=integration-test-results.trx"

            - name: Upload Test Results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: integration-test-results
                  path: ./coverage/integration/*.trx
                  retention-days: 30

            - name: Upload Coverage Data
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: integration-coverage
                  path: ./coverage/integration/**/coverage.cobertura.xml
                  retention-days: 30

            - name: Upload to Codecov
              uses: codecov/codecov-action@v5
              with:
                  directory: ./coverage/integration
                  flags: integration
                  override_branch: ${{ github.head_ref || github.ref_name }}
                  override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
                  fail_ci_if_error: true
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    coverage-report:
        name: Coverage Report
        runs-on: ubuntu-latest
        needs: [unit-tests, integration-tests]
        if: github.event_name == 'pull_request'
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download unit coverage
              uses: actions/download-artifact@v4
              with:
                  name: unit-coverage
                  path: coverage/unit

            - name: Download integration coverage
              uses: actions/download-artifact@v4
              with:
                  name: integration-coverage
                  path: coverage/integration

            - name: Generate unit coverage summary
              uses: danielpalme/ReportGenerator-GitHub-Action@5
              with:
                  reports: coverage/unit/**/coverage.cobertura.xml
                  targetdir: coverage/report/unit
                  reporttypes: MarkdownSummaryGithub
                  assemblyfilters: -*Tests*;-*Migrations*
                  title: Unit

            - name: Generate integration coverage summary
              uses: danielpalme/ReportGenerator-GitHub-Action@5
              with:
                  reports: coverage/integration/**/coverage.cobertura.xml
                  targetdir: coverage/report/integration
                  reporttypes: MarkdownSummaryGithub
                  assemblyfilters: -*Tests*;-*Migrations*
                  title: Integration

            - name: Compute PR changed source files
              run: |
                  mkdir -p coverage
                  git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
                  git diff --name-only --diff-filter=ACMR FETCH_HEAD HEAD -- src \
                    > coverage/changed-src.txt || true
                  git diff -U0 --diff-filter=ACMR FETCH_HEAD HEAD -- src \
                    > coverage/diff-u0.txt || true
                  echo "Changed source files:"
                  cat coverage/changed-src.txt || true

            - name: Build Codecov report header
              run: |
                  bash scripts/coverage-header.sh \
                    "${{ github.event.pull_request.number }}" \
                    "${{ github.repository }}" \
                    coverage/unit \
                    coverage/integration \
                    coverage/diff-u0.txt \
                    coverage/comment.md

            - name: Append unit-vs-integration breakdown
              run: |
                  bash scripts/coverage-comment.sh \
                    coverage/report/unit/SummaryGithub.md \
                    coverage/report/integration/SummaryGithub.md \
                    coverage/comment.md

            - name: Append per-suite uncovered files
              run: |
                  bash scripts/coverage-uncovered.sh \
                    coverage/unit \
                    coverage/integration \
                    coverage/comment.md \
                    coverage/changed-src.txt

            - name: Append feedback footer
              run: |
                  {
                    echo ""
                    echo ":loudspeaker: Thoughts on this report? [Let us know!](https://github.com/codecov/feedback/issues/255)"
                  } >> coverage/comment.md

            - name: Post coverage comment
              uses: marocchino/sticky-pull-request-comment@v2
              with:
                  header: test-coverage
                  number: ${{ github.event.pull_request.number }}
                  path: coverage/comment.md

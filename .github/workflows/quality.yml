name: Quality

# The CRAP metric, computed from the coverage the `Tests` run produced and downloaded
# here as an artifact. Security scanning lives in `security.yml`.
#
# SonarQube Cloud runs as Automatic Analysis rather than from CI: it covers
# maintainability, bugs and duplication, and cannot ingest coverage anyway. Running both
# at once is refused by SonarQube, so there is no scanner job here.
#
# Gated on `Tests` completing: a PR whose suites are red gets its test failures reported
# first, not buried under scanner output.
on:
    workflow_run:
        workflows: [Tests]
        types: [completed]

permissions:
    contents: read

env:
    DOTNET_VERSION: '9.0.x'
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
    # `workflow_run` fires in the context of the default branch, so the pull request behind
    # the triggering run has to be looked up rather than read from `github.event`.
    context:
        name: Resolve PR context
        runs-on: ubuntu-latest
        # Only follows a Tests run from a pull request. A merge to develop re-runs
        # nothing here: the same commit was already scanned on its pull request.
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'pull_request'
        outputs:
            pr: ${{ steps.pr.outputs.number }}
            sha: ${{ github.event.workflow_run.head_sha }}
            branch: ${{ github.event.workflow_run.head_branch }}
            base: ${{ steps.pr.outputs.base }}
        steps:
            - name: Find the pull request
              id: pr
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  pr=$(gh pr list \
                    --repo "${{ github.repository }}" \
                    --head "${{ github.event.workflow_run.head_branch }}" \
                    --state open --json number,baseRefName --jq '.[0] // empty')
                  echo "number=$(echo "$pr" | jq -r '.number // empty')" >> "$GITHUB_OUTPUT"
                  echo "base=$(echo "$pr" | jq -r '.baseRefName // "develop"')" >> "$GITHUB_OUTPUT"
                  echo "Pull request: ${pr:-none}"

    crap:
        name: CRAP
        runs-on: ubuntu-latest
        needs: [context]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.context.outputs.sha }}
                  # The changed-file list is a diff against the base branch.
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore tools
              run: dotnet tool restore

            - name: Download unit coverage
              uses: actions/download-artifact@v4
              with:
                  name: unit-coverage
                  path: coverage/unit
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}

            - name: Download integration coverage
              uses: actions/download-artifact@v4
              with:
                  name: integration-coverage
                  path: coverage/integration
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}

            - name: Download end-to-end coverage
              uses: actions/download-artifact@v4
              with:
                  name: e2e-coverage
                  path: coverage/e2e
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}

            - name: Compute changed source files
              run: |
                  mkdir -p crap
                  base="${{ needs.context.outputs.base }}"
                  if [ -n "${{ needs.context.outputs.pr }}" ]; then
                    git fetch --no-tags --depth=1 origin "$base"
                    git diff --name-only --diff-filter=ACMR FETCH_HEAD HEAD -- src \
                      > crap/changed-src.txt || true
                  else
                    : > crap/changed-src.txt
                  fi
                  echo "Changed source files:"
                  cat crap/changed-src.txt

            # Threshold lives in crap4dotnet-config.json, not here, so a local run and CI
            # agree. Exit 1 means methods breached it; that is reported, not fatal.
            - name: Analyse CRAP
              run: |
                  args=()
                  while IFS= read -r file; do
                    args+=(--coverage "$file")
                  done < <(find coverage/unit coverage/integration coverage/e2e -name 'coverage.cobertura.xml')

                  dotnet tool run dotnet-crap -- analyze ./116_backend.sln \
                    "${args[@]}" \
                    --output crap/crap-report.json || true

            - name: Upload the CRAP report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: crap-report
                  path: crap/
                  retention-days: 30

    report:
        name: Quality Report
        runs-on: ubuntu-latest
        needs: [context, crap]
        if: always() && needs.context.outputs.pr != ''
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download the CRAP report
              uses: actions/download-artifact@v4
              if: always()
              continue-on-error: true
              with:
                  name: crap-report
                  path: crap

            - name: Build the report
              run: |
                  bash scripts/quality-comment.sh \
                    "${{ needs.crap.result }}" \
                    quality-comment.md

                  bash scripts/crap-comment.sh \
                    crap/crap-report.json \
                    crap/changed-src.txt \
                    quality-comment.md

                  {
                    echo ""
                    echo "---"
                    echo "<sub>Runs after the Tests workflow completes. Machine-readable output:"
                    echo "the \`quality-report-md\` and \`crap-report\` artifacts on this run.</sub>"
                  } >> quality-comment.md

            - name: Post the report
              uses: marocchino/sticky-pull-request-comment@v2
              with:
                  header: quality-report
                  number: ${{ needs.context.outputs.pr }}
                  path: quality-comment.md

            - name: Upload the report for downstream tooling
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: quality-report-md
                  path: quality-comment.md
                  retention-days: 30

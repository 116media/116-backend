name: Quality

# SonarQube Cloud and the CRAP metric. Security scanning lives in `security.yml`.
#
# Both analysers start as soon as a pull request opens, rather than waiting for Tests.
# Sonar needs no coverage at all; CRAP runs its own unit suite for the coverage half of
# the metric, so its scores are conservative but arrive early. Only `security.yml` waits
# for the suites.
#
# Sonar also runs on develop, because new-code gating on a pull request is measured
# against the main branch analysis. Automatic Analysis must stay disabled in the project
# settings: SonarQube refuses a CI analysis while it is on.
on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [develop]

permissions:
    contents: read

env:
    DOTNET_VERSION: '9.0.x'
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
    sonar:
        name: SonarQube Cloud
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # Sonar needs full history to attribute blame and compute new-code periods.
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Cache the scanner and its analysis data
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.sonar/cache
                      ~/.dotnet/tools
                  key: sonar-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
                  restore-keys: sonar-${{ runner.os }}-

            # The scanner must wrap the build: it attaches a Roslyn analyser, so a cached
            # or `--no-build` compile produces an empty analysis.
            - name: Install SonarScanner
              run: dotnet tool install --global dotnet-sonarscanner || true

            - name: Analyse
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: |
                  args=()
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    args+=(/d:sonar.pullrequest.key="${{ github.event.pull_request.number }}")
                    args+=(/d:sonar.pullrequest.branch="${{ github.event.pull_request.head.ref }}")
                    args+=(/d:sonar.pullrequest.base="${{ github.event.pull_request.base.ref }}")
                  fi

                  dotnet sonarscanner begin \
                    /k:"116media_116-backend" \
                    /o:"116media" \
                    /d:sonar.host.url="https://sonarcloud.io" \
                    /d:sonar.token="${SONAR_TOKEN}" \
                    /d:sonar.scanner.scanAll=false \
                    "${args[@]}"

                  dotnet build --configuration Release --no-incremental

                  dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

    crap:
        name: CRAP
        runs-on: ubuntu-latest
        # Runs its own unit suite rather than waiting for Tests, so the metric lands on the
        # pull request immediately. Coverage is therefore unit-only, which makes the scores
        # conservative: a method covered solely by integration tests reads as uncovered.
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # The changed-file list is a diff against the base branch.
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore dependencies
              run: dotnet restore

            - name: Restore tools
              run: dotnet tool restore

            - name: Run Unit Tests with Coverage
              run: |
                  dotnet test tests/unit.slnf \
                    --configuration Release \
                    --no-restore \
                    --settings tests/coverage.unit.runsettings \
                    --collect:"XPlat Code Coverage" \
                    --results-directory ./coverage/unit

            - name: Compute changed source files
              run: |
                  mkdir -p crap
                  git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
                  git diff --name-only --diff-filter=ACMR FETCH_HEAD HEAD -- src \
                    > crap/changed-src.txt || true
                  echo "Changed source files:"
                  cat crap/changed-src.txt

            # Threshold lives in crap4dotnet-config.json, not here, so a local run and CI
            # agree. Exit 1 means methods breached it; that is reported, not fatal.
            - name: Analyse CRAP
              run: |
                  args=()
                  while IFS= read -r file; do
                    args+=(--coverage "$file")
                  done < <(find coverage/unit -name 'coverage.cobertura.xml')

                  dotnet tool run dotnet-crap -- analyze ./116_backend.sln \
                    "${args[@]}" \
                    --output crap/crap-report.json || true

            - name: Upload the CRAP report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: crap-report
                  path: crap/
                  retention-days: 30

    report:
        name: Quality Report
        runs-on: ubuntu-latest
        needs: [crap]
        if: always() && github.event_name == 'pull_request'
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download the CRAP report
              uses: actions/download-artifact@v4
              if: always()
              continue-on-error: true
              with:
                  name: crap-report
                  path: crap

            - name: Build the report
              run: |
                  bash scripts/quality-comment.sh \
                    "${{ needs.crap.result }}" \
                    quality-comment.md

                  bash scripts/crap-comment.sh \
                    crap/crap-report.json \
                    crap/changed-src.txt \
                    quality-comment.md \
                    "${{ github.repository }}" \
                    "${{ github.event.pull_request.head.sha }}"

            - name: Post the report
              uses: marocchino/sticky-pull-request-comment@v2
              with:
                  header: quality-report
                  number: ${{ github.event.pull_request.number }}
                  path: quality-comment.md

            - name: Upload the report for downstream tooling
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: quality-report-md
                  path: quality-comment.md
                  retention-days: 30

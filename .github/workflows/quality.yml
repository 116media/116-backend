name: Quality

# SonarQube Cloud and the CRAP metric. Security scanning lives in `security.yml`.
#
# The two analysers are triggered differently on purpose. Sonar needs no coverage, so it
# starts as soon as a pull request opens. CRAP is complexity weighed against coverage, and
# unit coverage alone scores integration-only code as untested, so it waits for the `Tests`
# run and reads every suite's artifacts. A pull request therefore produces two runs of this
# workflow: Sonar immediately, CRAP once the suites are green.
#
# Sonar also runs on develop, because new-code gating on a pull request is measured
# against the main branch analysis. Automatic Analysis must stay disabled in the project
# settings: SonarQube refuses a CI analysis while it is on.
on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [develop]
    workflow_run:
        workflows: [Tests]
        types: [completed]

permissions:
    contents: read

env:
    DOTNET_VERSION: '9.0.x'
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
    sonar:
        name: SonarQube Cloud
        runs-on: ubuntu-latest
        # Needs no coverage, so it does not wait. The `workflow_run` path is CRAP's.
        if: github.event_name != 'workflow_run'
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # Sonar needs full history to attribute blame and compute new-code periods.
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Cache the scanner and its analysis data
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.sonar/cache
                      ~/.dotnet/tools
                  key: sonar-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
                  restore-keys: sonar-${{ runner.os }}-

            # The scanner must wrap the build: it attaches a Roslyn analyser, so a cached
            # or `--no-build` compile produces an empty analysis.
            - name: Install SonarScanner
              run: dotnet tool install --global dotnet-sonarscanner || true

            - name: Analyse
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: |
                  args=()
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    args+=(/d:sonar.pullrequest.key="${{ github.event.pull_request.number }}")
                    args+=(/d:sonar.pullrequest.branch="${{ github.event.pull_request.head.ref }}")
                    args+=(/d:sonar.pullrequest.base="${{ github.event.pull_request.base.ref }}")
                  fi

                  dotnet sonarscanner begin \
                    /k:"116media_116-backend" \
                    /o:"116media" \
                    /d:sonar.host.url="https://sonarcloud.io" \
                    /d:sonar.token="${SONAR_TOKEN}" \
                    /d:sonar.scanner.scanAll=false \
                    /d:sonar.coverage.exclusions="**/*" \
                    /d:sonar.exclusions="**/Migrations/**,**/*.g.cs,**/*.Designer.cs" \
                    "${args[@]}"

                  dotnet build --configuration Release --no-incremental

                  dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

    # `workflow_run` fires in the context of the default branch, so the pull request behind
    # the triggering run has to be looked up rather than read from `github.event`.
    context:
        name: Resolve PR context
        runs-on: ubuntu-latest
        if: >-
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'pull_request'
        outputs:
            pr: ${{ steps.pr.outputs.number }}
            sha: ${{ github.event.workflow_run.head_sha }}
            base: ${{ steps.pr.outputs.base }}
        steps:
            - name: Find the pull request
              id: pr
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  pr=$(gh pr list \
                    --repo "${{ github.repository }}" \
                    --head "${{ github.event.workflow_run.head_branch }}" \
                    --state open --json number,baseRefName --jq '.[0] // empty')
                  echo "number=$(echo "$pr" | jq -r '.number // empty')" >> "$GITHUB_OUTPUT"
                  echo "base=$(echo "$pr" | jq -r '.baseRefName // "develop"')" >> "$GITHUB_OUTPUT"
                  echo "Pull request: ${pr:-none}"

    crap:
        name: CRAP
        runs-on: ubuntu-latest
        needs: [context]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.context.outputs.sha }}
                  # The changed-file list is a diff against the base branch.
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore tools
              run: dotnet tool restore

            - name: Download unit coverage
              uses: actions/download-artifact@v4
              with:
                  name: unit-coverage
                  path: coverage/unit
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}

            - name: Download integration coverage
              uses: actions/download-artifact@v4
              with:
                  name: integration-coverage
                  path: coverage/integration
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}

            - name: Download end-to-end coverage
              uses: actions/download-artifact@v4
              with:
                  name: e2e-coverage
                  path: coverage/e2e
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}

            - name: Compute changed source files
              run: |
                  mkdir -p crap
                  git fetch --no-tags --depth=1 origin "${{ needs.context.outputs.base }}"
                  git diff --name-only --diff-filter=ACMR FETCH_HEAD HEAD -- src \
                    > crap/changed-src.txt || true
                  echo "Changed source files:"
                  cat crap/changed-src.txt

            # Every test project writes its own report, so all of them are passed: a subset
            # reads as uncovered elsewhere and invents breaches. Threshold lives in
            # crap4dotnet-config.json so a local run and CI agree.
            - name: Analyse CRAP
              run: |
                  args=()
                  while IFS= read -r file; do
                    args+=(--coverage "$file")
                  done < <(find coverage -name 'coverage.cobertura.xml')

                  echo "coverage reports: ${#args[@]}"

                  dotnet tool run dotnet-crap -- analyze ./116_backend.sln \
                    "${args[@]}" \
                    --output crap/crap-report.json || true

            - name: Upload the CRAP report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: crap-report
                  path: crap/
                  retention-days: 30

    report:
        name: Quality Report
        runs-on: ubuntu-latest
        needs: [context, crap]
        if: always() && needs.context.outputs.pr != ''
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download the CRAP report
              uses: actions/download-artifact@v4
              if: always()
              continue-on-error: true
              with:
                  name: crap-report
                  path: crap

            - name: Build the report
              run: |
                  bash scripts/quality-comment.sh \
                    "${{ needs.crap.result }}" \
                    quality-comment.md

                  bash scripts/crap-comment.sh \
                    crap/crap-report.json \
                    crap/changed-src.txt \
                    quality-comment.md \
                    "${{ github.repository }}" \
                    "${{ needs.context.outputs.sha }}"

            - name: Post the report
              uses: marocchino/sticky-pull-request-comment@v2
              with:
                  header: quality-report
                  number: ${{ needs.context.outputs.pr }}
                  path: quality-comment.md

            - name: Upload the report for downstream tooling
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: quality-report-md
                  path: quality-comment.md
                  retention-days: 30
